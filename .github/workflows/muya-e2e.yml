name: Muya E2E

# Chromium covers the host page in packages/muya/e2e/host/.
# Firefox/WebKit have local exclusions described in packages/muya/e2e/README.md.

on:
  push:
    branches: [hotfix/v0.24.36]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/muya/src/**'
      - 'packages/muya/e2e/**'
      - 'packages/muya/examples/**'
      - 'packages/muya/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/muya-e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install Playwright browser (${{ matrix.project }})
        run: pnpm -C packages/muya/e2e exec playwright install --with-deps ${{ matrix.project }}

      - name: Verify table layout and code wrapping before tagging
        if: github.event_name == 'push'
        run: |
          pnpm -C packages/muya exec vitest run src/state/__tests__/tableLayout.spec.ts src/block/gfm/table/__tests__
          pnpm -C packages/muya/e2e exec playwright test --project=chromium tests/drag/table-layout.spec.ts tests/drag/table-drag-bar.spec.ts tests/drag/table-row-column-menu.spec.ts tests/blocks/table-column-widths-4894.spec.ts tests/options/code-font.spec.ts

      - name: Run Playwright (${{ matrix.project }})
        if: github.event_name == 'pull_request'
        run: pnpm -C packages/muya/e2e exec playwright test --project=${{ matrix.project }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: muya-e2e-report-${{ matrix.project }}
          path: packages/muya/e2e/playwright-report/
          retention-days: 7
