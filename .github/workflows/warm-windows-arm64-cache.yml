name: Warm Windows ARM64 release cache

on:
  push:
    branches: [develop]
    paths:
      - '.github/actions/restore-desktop-pnpm-store/**'
      - '.github/workflows/warm-windows-arm64-cache.yml'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-windows-arm64-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Set up Windows ARM64 Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.14.1'
          architecture: arm64
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Restore Windows ARM64 pnpm store
        id: pnpm-store
        uses: ./.github/actions/restore-desktop-pnpm-store

      - name: Install desktop build dependencies
        if: steps.pnpm-store.outputs.cache-hit != 'true'
        run: pnpm --filter . --filter 'marktext...' install --frozen-lockfile --ignore-scripts --prefer-offline
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save Windows ARM64 pnpm store
        if: steps.pnpm-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store.outputs.cache-key }}
