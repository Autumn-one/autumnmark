name: Publish AutumnMark Preview

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful preview build run (empty selects the latest matching build)
        required: false
        type: string
  push:
    branches:
      - 'release/*'

permissions:
  contents: read

concurrency:
  group: publish-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select a verified build with matching application sources
        id: source
        uses: actions/github-script@v9
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const { execFileSync, spawnSync } = require('node:child_process');
            const { writeFileSync } = require('node:fs');
            const repo = context.repo;
            const { data: workflow } = await github.rest.actions.getWorkflow({
              ...repo, workflow_id: 'package-preview.yml'
            });
            const requested = process.env.SOURCE_RUN_ID.trim();
            let candidates;
            if (requested) {
              if (!/^\d+$/.test(requested)) throw new Error('Invalid source run ID');
              const { data } = await github.rest.actions.getWorkflowRun({
                ...repo, run_id: Number(requested)
              });
              candidates = [data];
            } else {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: workflow.id, status: 'success', per_page: 100
              });
              candidates = data.workflow_runs;
            }
            let selected;
            for (const run of candidates) {
              if (run.conclusion !== 'success' || run.workflow_id !== workflow.id) continue;
              const ancestor = spawnSync('git', ['merge-base', '--is-ancestor', run.head_sha, context.sha]);
              if (ancestor.status !== 0) continue;
              const changes = execFileSync('git', [
                'diff', '--name-only', run.head_sha, context.sha, '--',
                'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml',
                'packages/desktop', 'packages/muya', 'scripts'
              ], { encoding: 'utf8' }).trim();
              if (changes) continue;
              selected = run;
              break;
            }
            if (!selected) throw new Error('No successful preview build matches this application source');
            const readPackage = path => JSON.parse(execFileSync(
              'git', ['show', selected.head_sha + ':' + path], { encoding: 'utf8' }
            ));
            const { version } = readPackage('package.json');
            if (version !== readPackage('packages/desktop/package.json').version) {
              throw new Error('Root and desktop versions differ');
            }
            if (!/^\d+\.\d+\.\d+-[0-9A-Za-z.-]+$/.test(version)) {
              throw new Error('This workflow only publishes prerelease versions');
            }
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...repo, run_id: selected.id, per_page: 100
            });
            const artifact = data.artifacts.find(item =>
              item.name === 'autumnmark-windows-x64-preview' && !item.expired
            );
            if (!artifact) throw new Error('The Windows build artifact is missing or expired');
            core.setOutput('run-id', String(selected.id));
            core.setOutput('sha', selected.head_sha);
            core.setOutput('version', version);
            core.setOutput('tag', 'v' + version);
            core.info('Publishing tested build ' + selected.html_url);
            writeFileSync('release-notes.md', [
              'AutumnMark · 秋笺的紫色 Logo 预览版。',
              '',
              '- 应用、安装程序和关于窗口统一使用第三版紫色标志。',
              '- 提供 Windows x64 安装程序、便携 ZIP 和 SHA-256 校验文件。',
              '- 远程 lint、类型检查及单元测试已通过。',
              '',
              '构建记录：' + selected.html_url,
              '源代码提交：' + selected.head_sha,
              ''
            ].join('\n'));

      - name: Download the tested Windows packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: autumnmark-windows-x64-preview
          path: dist
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package checksums
        working-directory: dist
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          test -f "autumnmark-win-x64-${VERSION}-setup.exe"
          test -f "autumnmark-win-x64-${VERSION}.zip"
          sha256sum --check SHA256SUMS.txt

      - name: Prepare release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set +e
          gh release view "$TAG" --json isDraft --jq .isDraft > release-state.txt 2> release-lookup-error.txt
          lookup_status=$?
          set -e
          if [ "$lookup_status" -eq 0 ]; then
            release_state=$(cat release-state.txt)
            if [ "$release_state" != "true" ]; then
              echo "::error::Release $TAG is already published."
              exit 1
            fi
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --title "AutumnMark $VERSION" --draft --prerelease --notes-file release-notes.md
          fi

      - name: Upload packages and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/*.exe dist/*.zip dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false
