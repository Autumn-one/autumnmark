name: E2E Test

on:
  push:
    branches: [release/v0.24.27]
  workflow_dispatch:
    inputs:
      platform:
        description: Hosted OS for the desktop test
        type: choice
        options: [linux, windows]
        default: linux
      grep:
        description: Playwright test title pattern (empty runs the full desktop suite)
        type: string
        required: false
  pull_request:
    types: [opened, synchronize, reopened]
    # This is the desktop electron Playwright suite. packages/muya has its
    # own e2e under packages/muya/e2e/ wired via muya-e2e.yml.
    paths-ignore:
      - 'packages/muya/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ (github.event_name == 'push' || inputs.platform == 'windows') && 'windows-latest' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Install System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - uses: ./.github/actions/setup
        with:
          desktop-only: 'true'

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: '0'

      - name: Build app
        run: pnpm build

      - name: Check release code before tagging
        if: github.event_name == 'push'
        run: pnpm check

      - name: Run E2E Tests
        shell: bash
        env:
          TEST_GREP: ${{ inputs.grep }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            pnpm -C packages/desktop exec playwright test \
              test/e2e/code-block-height.spec.ts \
              test/e2e/editor-selection-scroll.spec.ts \
              test/e2e/code-block-typing.spec.ts \
              test/e2e/code-block-wrap.spec.ts
            pnpm -C packages/desktop exec playwright test test/e2e/reading-mode.spec.ts \
              --grep 'the reading notice can be dismissed' --output=test-results/reading-notice
            exit $?
          fi
          tests=(pnpm test:e2e --grep="${TEST_GREP:-.*}")
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run --auto-servernum "${tests[@]}"
          else
            "${tests[@]}"
          fi

      - name: Upload code block previews
        if: github.event_name == 'push' && !cancelled()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: code-block-previews
          path: packages/desktop/test-results/**/code-edge-*.png
          retention-days: 7
