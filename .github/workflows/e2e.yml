name: E2E Test

on:
  push:
    branches: [hotfix/v0.24.36]
  workflow_dispatch:
    inputs:
      platform:
        description: Hosted OS for the desktop test
        type: choice
        options: [linux, windows]
        default: linux
      grep:
        description: Playwright test title pattern (empty runs the full desktop suite)
        type: string
        required: false
  pull_request:
    types: [opened, synchronize, reopened]
    # This is the desktop electron Playwright suite. packages/muya has its
    # own e2e under packages/muya/e2e/ wired via muya-e2e.yml.
    paths-ignore:
      - 'packages/muya/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ (github.event_name == 'push' || inputs.platform == 'windows') && 'windows-latest' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Install System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - uses: ./.github/actions/setup
        with:
          desktop-only: 'true'

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: '0'

      - name: Build app
        run: pnpm build

      - name: Check release code before tagging
        if: github.event_name == 'push'
        run: pnpm check

      - name: Verify empty-state button contrast across themes
        if: github.event_name == 'push'
        run: pnpm -C packages/desktop exec vitest run test/unit/specs/empty-state-button-contrast.spec.ts

      - name: Unpack the affected official Windows release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.24.35 --pattern 'autumnmark-win-x64-0.24.35.zip' --dir $env:RUNNER_TEMP
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/autumnmark-win-x64-0.24.35.zip" -DestinationPath "$env:RUNNER_TEMP/autumnmark-baseline"
          "AUTUMNMARK_PACKAGED_EXE=$env:RUNNER_TEMP/autumnmark-baseline/autumnmark-editor.exe" >> $env:GITHUB_ENV

      - name: Verify shipped executable with default CSS
        if: github.event_name == 'push'
        run: pnpm -C packages/desktop exec playwright test packaged-table-layout.spec.ts -g 'default CSS' --reporter=github

      - name: Verify shipped executable with full-width custom CSS
        if: github.event_name == 'push'
        run: pnpm -C packages/desktop exec playwright test packaged-table-layout.spec.ts -g 'full-width custom CSS' --reporter=github

      - name: Run E2E Tests
        shell: bash
        env:
          TEST_GREP: ${{ inputs.grep }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            pnpm -C packages/desktop exec playwright test test/e2e/table-layout.spec.ts test/e2e/code-block-wrap.spec.ts
            exit $?
          fi
          tests=(pnpm test:e2e --grep="${TEST_GREP:-.*}")
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run --auto-servernum "${tests[@]}"
          else
            "${tests[@]}"
          fi
