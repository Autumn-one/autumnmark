name: Setup pnpm and Node.js
description: Install pnpm, Node.js, and project dependencies (skips postinstall scripts)

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '22.21.1'
  desktop-only:
    description: Install workspace tooling and the desktop package with its dependencies
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.0

    - name: Install Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install Dependencies
      if: inputs.desktop-only != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Install desktop build dependencies
      if: inputs.desktop-only == 'true'
      shell: bash
      run: pnpm --filter . --filter 'marktext...' install --frozen-lockfile --ignore-scripts --prefer-offline
      env:
        GITHUB_TOKEN: ${{ github.token }}
