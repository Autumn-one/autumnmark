name: Restore desktop pnpm store
description: Share the desktop dependency store between the default branch and release tags

outputs:
  path:
    description: Location of the pnpm store on the runner
    value: ${{ steps.store.outputs.path }}
  cache-hit:
    description: Whether the current lockfile already has a cache entry
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: Cache key for the current lockfile
    value: ${{ steps.cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Locate pnpm store
      id: store
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        "path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT
        "version=$(pnpm --version)" >> $env:GITHUB_OUTPUT

    - name: Restore pnpm store
      id: cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ env.CACHE_PREFIX }}${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ env.CACHE_PREFIX }}
      env:
        CACHE_PREFIX: desktop-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.store.outputs.version }}-${{ hashFiles('.npmrc', 'pnpm-workspace.yaml') }}-
